[metadata]
name = score-system
version = 1.0.0
description = Enhanced Self-Correcting LLM with Reinforcement Learning
long_description = file: README.md
long_description_content_type = text/markdown
author = SCoRe Team
author_email = team@score.ai
license = MIT
license_files = LICENSE
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Science/Research
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Topic :: Scientific/Engineering :: Artificial Intelligence
    Topic :: Software Development :: Libraries :: Python Modules
keywords = 
    machine learning
    reinforcement learning
    language models
    self-correction
    llm

[options]
packages = find:
python_requires = >=3.8
include_package_data = True
zip_safe = False
install_requires =
    torch>=2.0.0
    transformers>=4.30.0
    numpy>=1.24.0
    tqdm>=4.65.0
    matplotlib>=3.7.0
    nltk>=3.8.0
    rouge>=1.0.1
    radon>=5.1.0
    sympy>=1.12
    typing-extensions>=4.5.0
    psutil>=5.9.0
    datasets>=2.12.0

[options.packages.find]
where = .
include = src*

[options.extras_require]
dev =
    pytest>=7.4.0
    pytest-cov>=4.1.0
    pytest-xdist>=3.3.0
    pytest-mock>=3.11.0
    hypothesis>=6.82.0
    black>=23.0.0
    isort>=5.12.0
    flake8>=6.0.0
    mypy>=1.4.0
    bandit>=1.7.5
    pre-commit>=3.3.0
docs =
    sphinx>=7.1.0
    sphinx-rtd-theme>=1.3.0
profiling =
    memory-profiler>=0.61.0
    line-profiler>=4.1.0
    py-spy>=0.3.14
all =
    %(dev)s
    %(docs)s
    %(profiling)s

[options.entry_points]
console_scripts =
    score-train = main:main
    score-inference = scripts.inference:main
    score-preprocess = scripts.preprocess_data:main

# Pytest configuration
[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --cov=src
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml
    --cov-fail-under=80
    --durations=10
    --maxfail=5
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    gpu: marks tests that require GPU
    network: marks tests that require network access
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Coverage configuration  
[coverage:run]
source = src
omit = 
    */tests/*
    */test_*
    */__pycache__/*
    */venv/*
    */env/*
    setup.py
branch = True

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod
show_missing = True
precision = 2

[coverage:html]
directory = htmlcov

# Flake8 configuration
[flake8]
max-line-length = 120
extend-ignore = 
    E203,  # whitespace before ':'
    E501,  # line too long (handled by black)
    W503,  # line break before binary operator
    W504,  # line break after binary operator
    E722,  # do not use bare except
exclude =
    .git,
    __pycache__,
    .pytest_cache,
    .mypy_cache,
    .tox,
    venv,
    env,
    build,
    dist,
    *.egg-info
per-file-ignores =
    __init__.py:F401,F403
    tests/*:D,S101,F401,F403
max-complexity = 12
docstring-convention = google
statistics = True
count = True

# MyPy configuration
[mypy]
python_version = 3.8
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True
strict_equality = True
show_error_codes = True
show_error_context = True
pretty = True

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "transformers.*",
    "matplotlib.*",
    "nltk.*",
    "rouge.*",
    "radon.*",
    "sympy.*",
    "tqdm.*",
    "psutil.*",
    "datasets.*",
]
ignore_missing_imports = true

# Black configuration
[tool:black]
line-length = 120
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# isort configuration
[tool:isort]
profile = "black"
multi_line_output = 3
line_length = 120
known_first_party = ["src"]
known_third_party = ["torch", "transformers", "numpy", "matplotlib", "nltk", "rouge", "radon", "sympy", "tqdm", "psutil", "datasets"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
default_section = "THIRDPARTY"
combine_as_imports = true
force_grid_wrap = 0
force_sort_within_sections = true
skip_glob = ["*.git/*", "*.mypy_cache/*", "*.pytest_cache/*", "*.tox/*", "*venv/*"]

# Bandit security configuration
[bandit]
exclude_dirs = ["tests", "venv", "env", ".tox"]
skips = ["B101", "B601"]  # Skip assert and shell usage warnings for tests

# Documentation configuration
[build_sphinx]
source-dir = docs
build-dir = docs/_build
all_files = 1 